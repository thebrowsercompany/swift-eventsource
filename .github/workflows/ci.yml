name: Run CI
on:
  push:
    branches: [ main-bcny ]
    paths-ignore:
      - '**.md' # Do not need to run CI for markdown changes.
  pull_request:
    branches: [ main-bcny ]
    paths-ignore:
      - '**.md'

jobs:
  macos-build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - xcode-version: 16.4
            ios-sim: 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
            os: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # If you only need the current version keep this.

      - uses: ./.github/actions/ci
        with:
          xcode-version: ${{ matrix.xcode-version }}
          ios-sim: ${{ matrix.ios-sim }}

      - uses: ./.github/actions/build-docs

  linux-build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        swift-version:
          # This package originally goes back to Swift 5.0
          # however, we're unable to specify a dependency at a specific SHA
          # until Swift version 5.5+ so while these reflect what used to be
          # supported by the base package, this fork requires a different
          # minimum toolchain and package description.
          # - 5.1
          # - 5.2
          # - 5.3
          # - 5.4
          # - 5.5
          - 5.6
          - 5.7
          - 5.8
          - 5.9

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # If you only need the current version keep this.

      - name: Build and test
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          swift:${{ matrix.swift-version }}
          swift test --enable-test-discovery --disable-automatic-resolution

  windows-build:
    name: Windows - Swift 6.4.0
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Swift
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Build and test
        run: swift test --disable-automatic-resolution
